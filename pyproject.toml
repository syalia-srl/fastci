[project]
name = "fastci"
version = "0.2.0.dev0"
description = "Run in each case only the tests and checks a change can break, cheapest first."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "coverage>=7.10",
    "pytest-cov>=6.0",
]

[project.scripts]
fastci = "fastci.cli:main"

[project.entry-points.pytest11]
"fastci.python.plugin" = "fastci.python.plugin"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]

[tool.ruff]
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# An audit hook must never raise, so the hooks swallow every error on purpose.
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
