name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      - name: tag matches the declared version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(uv run python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          [ "$tag" = "$declared" ] || { echo "::error::tag $GITHUB_REF_NAME != $declared"; exit 1; }
      - run: uv build
      - name: publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk "/^## ${GITHUB_REF_NAME#v}\$/{f=1;next}/^## /{f=0}f" CHANGELOG.md)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes "$notes"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes" dist/*
          fi
