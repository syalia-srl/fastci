# Written by `fastci setup`. fastci picks what runs from the event:
# a pull request runs the checks and the tests the change can break, a push to
# @@BRANCH@@ runs the whole fast suite, a release branch or tag adds the slow ones.
name: fastci
on:
  pull_request:
  push:
    branches: [@@BRANCH@@, "release/**"]
    tags: ["v*"]
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: fastci-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uvx --from git+https://github.com/syalia-srl/fastci@v@@VERSION@@ fastci
        env:
          GH_TOKEN: ${{ github.token }}
      # The flaky tests' outcomes on @@BRANCH@@, which the next run there extends.
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/@@BRANCH@@'
        with:
          name: fastci-flaky
          path: .fastci/flaky.json
          retention-days: 90
          if-no-files-found: ignore
  # Records what every test runs, for picking in pull requests. Never gates.
  map:
    if: github.event_name == 'push' && github.ref == 'refs/heads/@@BRANCH@@'
    runs-on: ubuntu-latest
    concurrency:
      group: fastci-map
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx --from git+https://github.com/syalia-srl/fastci@v@@VERSION@@ fastci map record --out "$RUNNER_TEMP/fastci/map.json.gz" -- @@ARGS@@ || echo "::warning title=fastci::suite failed under recording"
      - uses: actions/upload-artifact@v4
        with:
          name: fastci
          path: ${{ runner.temp }}/fastci/map.json.gz
          retention-days: 14
